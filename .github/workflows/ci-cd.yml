name: Secure CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-security:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest bandit pip-audit

      - name: Automated tests
        run: |
          pytest -v --junitxml=test-results.xml

      - name: Python security scan
        run: |
          bandit -r app.py -s B104 -f json -o bandit-report.json
          bandit -r app.py -s B104

      - name: Dependency vulnerability scan
        run: |
          pip-audit -r requirements.txt \
            --format json \
            --output pip-audit-report.json

      - name: Upload test and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-security-reports
          path: |
            test-results.xml
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: warn

  docker-build-scan-publish:
    name: Docker Build, Scan and Publish
    needs: test-and-security
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t secure-cicd-app:${{ github.sha }} .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: secure-cicd-app:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Publish image to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag secure-cicd-app:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Generate pipeline report
        if: always()
        env:
          TEST_RESULT: ${{ needs.test-and-security.result }}
          DOCKER_RESULT: ${{ job.status }}
        run: |
          mkdir -p reports
          {
            echo "# Secure CI/CD Pipeline Report"
            echo ""
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Commit: $GITHUB_SHA"
            echo "- Trigger: $GITHUB_EVENT_NAME"
            echo "- Test and security job: $TEST_RESULT"
            echo "- Docker job status: $DOCKER_RESULT"
            echo "- Docker image scan: HIGH/CRITICAL findings reported"
            echo ""
            echo "Review the accompanying test and security artifacts."
          } > reports/pipeline-report.md
          if [ -f trivy-report.txt ]; then
            cp trivy-report.txt reports/
          fi

      - name: Upload pipeline report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-report
          path: reports/
          if-no-files-found: warn